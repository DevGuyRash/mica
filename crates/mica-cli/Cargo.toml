[package]
name = "mica-cli"
version.workspace = true
edition.workspace = true
description = "Standalone CLI for Mica vaults: list, edit, restructure, version, diff, migrate, and repair mica blocks without Obsidian."
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "mica"
path = "src/main.rs"

[dependencies]
flate2 = "1"
mica-core = { path = "../mica-core" }
# Arg parsing for ~16 subcommands with flags/help/exit codes; a hand-rolled std
# parser was rejected (>400 lines, worse help UX). derive+help only, no extras.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
# The sidecar ledger/manifest formats ARE JSON(L); core types already derive serde.
serde_json = "1"

[dev-dependencies]
# Integration tests create throwaway vaults; trivial to hand-roll but std has no
# recursive temp-dir with cleanup-on-drop.
tempfile = "3"
