[package]
name = "mica-core"
version.workspace = true
edition.workspace = true
description = "Pure Rust core for Mica: fence scanner, CST, serializer, structural ops, diff, hashing, and identity."
license-file = "LICENSE"
publish = false

[package.metadata.wasm-pack.profile.release]
# Rust's release profile already applies -O3 and LTO. Avoid a second optimizer
# whose version depends on PATH and whose work can exceed clean-build budgets.
wasm-opt = false

[lints]
workspace = true

[lib]
# cdylib -> wasm for the plugin; rlib -> native `cargo test`.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
blake3 = "1"
uuid = { version = "1", features = ["v7", "js"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
similar = { version = "2", features = ["inline"] }
