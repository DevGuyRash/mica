[package]
name = "mica-core"
version = "0.1.0"
edition = "2021"
description = "Pure Rust core for the Mica Obsidian plugin: fence scanner, CST, serializer, diff, hashing, and identity."
license = "MIT"
publish = false

[lib]
# cdylib -> wasm for the plugin; rlib -> native `cargo test`.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
blake3 = "1"
uuid = { version = "1", features = ["v7", "js"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
similar = { version = "2", features = ["inline"] }

[profile.release]
# Speed-first per project goals; wasm-opt (run by wasm-pack) trims size afterward.
opt-level = 3
lto = true
codegen-units = 1
