# pnpm settings (pnpm 11 reads config from here, not the package.json "pnpm" field).
# Build-script approvals: esbuild installs its native binary; classic-level builds
# leveldb bindings used by the wdio toolchain. Edge/Gecko driver downloads are
# declined — Obsidian tests drive Electron (Chromium) only.
allowBuilds:
    classic-level: true
    edgedriver: false
    esbuild: true
    geckodriver: false
