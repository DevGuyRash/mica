# pnpm settings (pnpm 11 reads config from here, not the package.json "pnpm" field).
# Build-script approvals: esbuild installs its native binary; classic-level builds
# leveldb bindings used by the wdio toolchain. Edge/Gecko driver downloads are
# declined — Obsidian tests drive Electron (Chromium) only.
allowBuilds:
    classic-level: true
    edgedriver: false
    esbuild: true
    geckodriver: false

# Keep Obsidian's CodeMirror SDK on one nominal type graph. Mocha and WDIO also
# request vulnerable transitive versions; the patched overrides preserve their
# consumed APIs and support this repo's Node 22 floor.
overrides:
    "@codemirror/state": 6.5.0
    "@codemirror/view": 6.38.6
    brace-expansion@1: 1.1.16
    brace-expansion@2: 2.1.2
    diff: 8.0.4
    serialize-javascript: 7.0.7
