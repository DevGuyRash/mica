name: CI

on:
    push:
        branches: [main]
        tags: ["*"]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
              with:
                  version: 11.3.0

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22.12.0
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-20
              with:
                  toolchain: 1.97.1
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown

            - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

            - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
              with:
                  tool: wasm-pack@0.15.0

            - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
              with:
                  tool: cargo-deny@0.20.2

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Audit JavaScript dependencies
              run: pnpm audit --audit-level high
            - name: Audit Rust dependencies
              run: cargo deny check advisories

            # Tier 1+gate: format, typecheck, lint, Rust unit/regression tests.
            - name: Check
              run: pnpm run check
            - name: Rust format
              run: cargo fmt --all -- --check
            - name: Clippy
              run: cargo clippy --workspace --all-targets --locked -- -D warnings
            - name: CLI build
              run: cargo build --release -p mica-cli --locked

            # Tier 2: build the WASM core + bundle, then boundary smoke in Node.
            - name: Build
              run: pnpm run build
            - name: Verify release assets
              run: pnpm run check:release:assets
            - name: Smoke
              run: pnpm run smoke

            # Tier 3: contract + rendering specs inside a real downloaded Obsidian.
            - name: Cache Obsidian binaries
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: .obsidian-cache
                  key: obsidian-${{ runner.os }}
            - name: E2E (real Obsidian under Xvfb)
              run: xvfb-run -a pnpm run e2e

            - name: Upload plugin release assets
              if: github.ref_type == 'tag'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: mica-${{ github.ref_name }}
                  if-no-files-found: error
                  path: |
                      main.js
                      manifest.json
                      styles.css
