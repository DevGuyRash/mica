name: Obsidian release

# Review pushes validate; a new version on main publishes after all checks.
# No tag trigger or version-writeback commit: publication cannot retrigger itself.
on:
    push:
        branches: [review, main]
    workflow_dispatch:
        inputs:
            source_sha:
                description: Optional exact main commit (defaults to the dispatched main HEAD)
                required: false
                type: string
            preview_sha:
                description: Optional Community preview SHA (must have the same tree as source)
                required: false
                type: string
            preview_report:
                description: Optional HTTPS Community preview evidence (required when preview_sha is supplied)
                required: false
                type: string
            qualification_report:
                description: Optional HTTPS additional qualification evidence
                required: false
                type: string
            publish:
                description: Publish a new immutable release after qualification
                required: true
                default: false
                type: boolean

permissions:
    contents: read

concurrency:
    group: obsidian-release-${{ github.repository }}-${{ github.ref }}
    cancel-in-progress: false

env:
    SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    PREVIEW_SHA: ${{ inputs.preview_sha }}
    PREVIEW_REPORT: ${{ inputs.preview_report }}
    QUALIFICATION_REPORT: ${{ inputs.qualification_report }}

jobs:
    qualify:
        if: github.event_name == 'push' || (github.ref == 'refs/heads/main' && (inputs.source_sha == '' || inputs.source_sha == github.sha))
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        outputs:
            artifact_id: ${{ steps.assets.outputs.artifact-id }}
            release_needed: ${{ steps.release.outputs.release_needed }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ inputs.source_sha || github.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22.13.0

            - name: Read product metadata
              id: product
              run: node scripts/release.mjs inspect

            - name: Validate exact main candidate and any optional report bindings
              if: github.ref == 'refs/heads/main'
              run: node scripts/release.mjs candidate

            - name: Check pinned release bundle
              run: node scripts/release.mjs parity --upstream

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
              if: steps.product.outputs.manager == 'pnpm'
              with:
                  version: ${{ steps.product.outputs.pnpm }}
                  run_install: false

            - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
              if: steps.product.outputs.rust == 'true'
              with:
                  toolchain: ${{ steps.product.outputs.toolchain }}
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown

            - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
              if: steps.product.outputs.rust == 'true'
              with:
                  tool: wasm-pack@0.15.0,cargo-deny@0.20.2

            - name: Install npm dependencies
              if: steps.product.outputs.manager == 'npm'
              run: npm ci --ignore-scripts

            - name: Install pnpm dependencies
              if: steps.product.outputs.manager == 'pnpm'
              run: pnpm install --frozen-lockfile

            - name: Install browser for Viewgram qualification
              if: steps.product.outputs.manager == 'npm'
              run: |
                  npx --no-install playwright install --with-deps chromium
                  echo "CHROMIUM_PATH=$(node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')" >> "$GITHUB_ENV"

            # Product scripts are the only authority for required test commands.
            # Full device qualification remains separate; never inject an owner
            # credential or label hosted validation as native-device acceptance.
            - name: Qualify npm product
              if: steps.product.outputs.manager == 'npm'
              run: npm run release:validate

            - name: Qualify pnpm product
              if: steps.product.outputs.manager == 'pnpm'
              run: pnpm run release:validate

            - name: Official Obsidian public scanner preflight
              id: scanner
              uses: obsidianmd/obsidian-workflows@8167caed39664214d82c86fdfa32e06d8d55f61d # v1.2.3
              with:
                  type: plugin
                  mode: pr
                  build: "false"
                  scanner-lint: true
                  strict: true
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            - name: Advisory product compatibility
              if: github.event_name == 'workflow_dispatch' && steps.product.outputs.advisory == 'true'
              continue-on-error: true
              run: node scripts/release.mjs advisory

            - name: Check whether this exact version needs publication
              id: release
              if: github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/release.mjs release-needed

            - name: Stage exact assets and bound receipt
              if: steps.release.outputs.release_needed == 'true'
              run: node scripts/release.mjs stage

            - name: Upload qualified candidate
              id: assets
              if: steps.release.outputs.release_needed == 'true'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: obsidian-${{ github.run_id }}-${{ github.run_attempt }}
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 7
                  path: release/

    # These previously approved short-lived permissions are isolated from builds.
    attest:
        if: github.ref == 'refs/heads/main' && needs.qualify.outputs.release_needed == 'true'
        needs: qualify
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            id-token: write
            attestations: write
        outputs:
            artifact_id: ${{ steps.provenance.outputs.artifact-id }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ inputs.source_sha || github.sha }}
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22.13.0
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  artifact-ids: ${{ needs.qualify.outputs.artifact_id }}
                  path: release
                  merge-multiple: true
            - name: Validate qualified bytes before attesting
              run: |
                  node scripts/release.mjs parity --upstream
                  node scripts/release.mjs verify-staged
            - name: Attest exact workflow-built plugin assets
              id: attest
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
              with:
                  subject-path: |
                      release/main.js
                      release/manifest.json
                      release/styles.css
            - name: Retain the original Sigstore bundle
              env:
                  BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
              run: |
                  mkdir provenance
                  cp "$BUNDLE_PATH" provenance/bundle.json
            - name: Install checksum-pinned official GitHub CLI
              run: node scripts/release.mjs install-gh
            - name: Verify build provenance identity and exact hashes
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/release.mjs verify-provenance
            - name: Preserve provenance for independent publication verification
              id: provenance
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: provenance-${{ github.run_id }}-${{ github.run_attempt }}
                  if-no-files-found: error
                  retention-days: 7
                  path: provenance/

    publish:
        if: github.ref == 'refs/heads/main' && needs.qualify.outputs.release_needed == 'true' && (github.event_name == 'push' || inputs.publish)
        needs: [qualify, attest]
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ inputs.source_sha || github.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22.13.0

            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  artifact-ids: ${{ needs.qualify.outputs.artifact_id }}
                  path: release
                  merge-multiple: true

            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  artifact-ids: ${{ needs.attest.outputs.artifact_id }}
                  path: provenance
                  merge-multiple: true

            - name: Verify pinned release bundle
              run: node scripts/release.mjs parity --upstream

            - name: Install checksum-pinned official GitHub CLI
              run: node scripts/release.mjs install-gh

            # No product build or dependency lifecycle runs with this token.
            - name: Publish and verify immutable assets
              env:
                  GH_TOKEN: ${{ github.token }}
                  IMMUTABLE_RELEASES_CONFIRMED: ${{ vars.OBSIDIAN_IMMUTABLE_RELEASES_CONFIRMED }}
              run: node scripts/release.mjs publish
